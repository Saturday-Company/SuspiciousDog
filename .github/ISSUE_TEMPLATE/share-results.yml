name: Share sniff results
description: Add your counts to the public dataset. Counts only, generated by `sdog share`.
title: "Sniff results"
labels: ["results"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. This is what `sdog share` produced on your machine: factor names, outcome names and integers.
        No prompts, replies, paths or project names. If you see anything else in the box, delete it before submitting.
  - type: textarea
    id: results
    attributes:
      label: Counts
      description: Paste the JSON from `sdog share` (it is filled in automatically when you use the command).
      render: json
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Main model in these sessions (optional)
      options: ["Claude", "GPT", "Gemini", "Mixed", "Other", "Rather not say"]
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Anything the dog should know? (optional)
      description: e.g. "solo developer, mostly frontend". Don't paste transcripts.
    validations:
      required: false
