name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m suspiciousdog demo
      - run: python -m suspiciousdog kit --path tests/fixtures/kit --no-cache
      - run: python -m suspiciousdog kit --path tests/fixtures/kit-other --no-cache --all
      - run: python -m suspiciousdog check "Never push to main without asking" --path tests/fixtures/kit
      - run: echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | python -m suspiciousdog mcp
      - run: python -m suspiciousdog doctor
