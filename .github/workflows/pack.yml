name: pack
# Adds up every shared result (issues labelled "results") and publishes the pack page on GitHub Pages.
# Nothing is published until there is at least one valid share.
on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
  issues: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'results')
    runs-on: ubuntu-latest
    outputs:
      shares: ${{ steps.pack.outputs.shares }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect the shares
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "repos/${{ github.repository }}/issues?labels=results&state=all&per_page=100" --jq '.[]' > issues.jsonl
      - id: pack
        run: python scripts/pack.py issues.jsonl site
      - if: steps.pack.outputs.shares != '0'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    if: needs.build.outputs.shares != '0'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
